name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # A file nothing imports, or an export nothing reads, is a mistake worth
      # catching before it lands.
      - run: npx knip

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Nothing here can flash a board, but a sketch that does not compile is
      # worth knowing about without one - and the flash geometry that stopped it
      # booting once lives in platformio.ini, which this reads.
      - run: pip install platformio
      - run: pio run -d firmware
