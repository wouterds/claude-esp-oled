name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Nothing here can flash a board, and nothing here can tell whether the
      # panel came up. What this does catch is a sketch that stopped compiling,
      # and the flash and PSRAM geometry that stopped it booting once, which
      # lives in platformio.ini and is read to build either env.
      - run: pip install platformio
      - run: pio run -d firmware -e esp32-s3-touch-lcd-185
      - run: pio run -d firmware -e selftest
