post-merge:
  parallel: true
  commands:
    dependencies:
      run: npm install --package-lock-only

post-checkout:
  parallel: true
  # A rebase is a checkout per replayed commit, and this rewrites
  # package-lock.json - so replaying a commit that touches the lock leaves the
  # tree dirty before the next one applies, and the commit introducing it lands
  # empty. Git then reports "nothing to commit, working tree clean" while the
  # change is missing, and continuing drops it. Skipping here beats LEFTHOOK=0
  # at the call site, which would also disable the pre-commit checks.
  skip:
    - rebase
    - merge
  commands:
    dependencies:
      run: npm install --package-lock-only

pre-commit:
  commands:
    # A sketch that does not compile is not a commit, and this is the only build
    # there is - nothing runs on a push. So a missing toolchain fails rather than
    # skipping: the glob already means a commit touching only docs never reaches
    # here, and the only person who can be stopped by this is somebody changing
    # firmware they have not compiled. The generators are in the glob because
    # they write the headers the firmware includes.
    firmware:
      glob: "firmware/**/*.{c,cpp,h,ini,py}"
      run: |
        pio="$(command -v pio || echo "$HOME/.platformio/penv/bin/pio")"
        [ -x "$pio" ] || {
          echo "platformio not installed - see .agents/docs/hardware.md" >&2; exit 1; }
        "$pio" run -d firmware

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
