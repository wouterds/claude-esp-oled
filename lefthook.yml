post-merge:
  parallel: true
  commands:
    dependencies:
      run: npm install --package-lock-only

post-checkout:
  parallel: true
  # A rebase is a checkout per replayed commit, and this rewrites
  # package-lock.json - so replaying a commit that touches the lock leaves the
  # tree dirty before the next one applies, and the commit introducing it lands
  # empty. Git then reports "nothing to commit, working tree clean" while the
  # change is missing, and continuing drops it. Skipping here beats LEFTHOOK=0
  # at the call site, which would also disable the pre-commit checks.
  skip:
    - rebase
    - merge
  commands:
    dependencies:
      run: npm install --package-lock-only

pre-commit:
  commands:
    # A sketch that does not compile is not a commit. Skipped rather than failed
    # where PlatformIO is absent, because a checkout that only touches docs
    # should not need a toolchain - CI compiles every push regardless.
    firmware:
      glob: "firmware/**/*.{c,cpp,h,ini}"
      run: |
        pio="$(command -v pio || echo "$HOME/.platformio/penv/bin/pio")"
        if [ -x "$pio" ]; then "$pio" run -d firmware; else
          echo "platformio not installed - skipping the build"; fi

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
