; Waveshare ESP32-S3-Touch-LCD-1.85 - an ESP32-S3R8 driving a 360x360 round IPS
; panel over QSPI. There is no PlatformIO board definition for it, so this is
; the generic S3 devkit narrowed to what this module actually carries.
[env:esp32-s3-touch-lcd-185]
; pioarduino rather than the official espressif32, which is still on Arduino
; core 2.x. Arduino_GFX's ESP32 backend includes esp32-hal-periman.h, which
; only exists from core 3.0 - on 2.x the build dies in the library's own
; headers with nothing pointing at the core version as the cause.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; The R8 is 16MB of flash and 8MB of *octal* PSRAM, where the devkit profile
; assumes 8MB flash and quad. Both are silent when wrong: the wrong flash header
; stops the sketch before it reaches setup(), and qio_qspi leaves the framebuffer
; allocation failing with the panel already lit and nothing on it.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The S3 talks over its built-in USB-Serial-JTAG rather than a UART bridge, and
; CDC_ON_BOOT is what points `Serial` at it. Left at the devkit default of 0,
; `Serial` goes to the UART pins and the board looks mute while running fine.
;
; -Os is the framework default and the face is drawn a pixel at a time, so the
; optimiser is worth more here than the flash it costs.
build_unflags = -Os
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=4
  -O2

; No graphics library. The panel is driven through esp_lcd with Waveshare's
; own ST77916 driver vendored into src/, which is the only stack this glass
; is actually verified against.

monitor_speed = 115200
; On the S3's native USB-Serial-JTAG, DTR drives GPIO0 and RTS drives EN - and
; macOS asserts DTR the moment the port is opened. Left at the default, simply
; attaching a monitor resets the board into `waiting for download` and the
; sketch never runs while anything is watching it.
monitor_dtr = 0
monitor_rts = 0

; Bisects a panel that comes up wrong. The solid fills are drawn straight at the
; glass; the last two go through the framebuffer. Colours right and framebuffer
; wrong puts the fault in the flush path, everything wrong puts it in the init.
[env:selftest]
extends = env:esp32-s3-touch-lcd-185
build_flags = ${env:esp32-s3-touch-lcd-185.build_flags} -DBUDDY_SELFTEST

; The same self-test against the other panel revision. Waveshare tells the two
; apart by reading register 0x04 back and this panel answers that read with
; zeroes, so which one it is has to be settled by trying them.
[env:selftest-v2]
extends = env:esp32-s3-touch-lcd-185
build_flags = ${env:esp32-s3-touch-lcd-185.build_flags} -DBUDDY_SELFTEST -DST77916_PANEL_V2
