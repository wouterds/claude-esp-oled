; Two boards, one firmware, an env each. There is no PlatformIO board definition
; for either module, so both are the generic S3 devkit narrowed to what the
; module actually carries - and everything narrowed below is silent when it is
; wrong rather than loud.
;
;   pio run -e esp32-s3-touch-lcd-185      Waveshare ESP32-S3-Touch-LCD-1.85B
;   pio run -e esp32-s3-touch-amoled-175c  Waveshare ESP32-S3-Touch-AMOLED-1.75C
;
; Which is which is not a guess: `esptool flash-id` reports 16MB for the first
; and 32MB for the second, and firmware:flash checks that before it writes.

[env]
; pioarduino rather than the official espressif32, which is still on Arduino
; core 2.x. Arduino_GFX's ESP32 backend includes esp32-hal-periman.h, which
; only exists from core 3.0 - on 2.x the build dies in the library's own
; headers with nothing pointing at the core version as the cause.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 8MB of *octal* PSRAM on both, where the devkit profile assumes quad. Wrong,
; qio_qspi leaves the framebuffer allocation failing with the panel already lit
; and nothing on it.
board_build.arduino.memory_type = qio_opi

; The S3 talks over its built-in USB-Serial-JTAG rather than a UART bridge, and
; CDC_ON_BOOT is what points `Serial` at it. Left at the devkit default of 0,
; `Serial` goes to the UART pins and the board looks mute while running fine.
;
; -Os is the framework default and the scene is drawn a pixel at a time, so
; the optimiser is worth more here than the flash it costs.
build_unflags = -Os
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -O2

; Only src, because the framework's own warnings are not ours to fix, and fatal
; because there is nothing else that checks this - a warning nobody is made to
; read in an eight second build is a warning nobody reads. The two truncation
; classes are off: they fire on snprintf and strncpy into buffers sized from the
; constants feeding them, which the compiler cannot see the bound of, and
; contorting five correct call sites to quieten it is the worse code.
build_src_flags =
  -Wall
  -Wextra
  -Werror
  -Wno-format-truncation
  -Wno-stringop-truncation

; No graphics library. Each panel is driven through esp_lcd with a vendored
; driver, which is the only stack either piece of glass is verified against.

; The one library, and it is not a graphics library either: an encoder, for the
; screenshots. It carries its own zlib, and it takes RGB565 a line at a time
; with a flag for the byte order - which is exactly the framebuffer, already in
; the panel's order, handed over without a conversion pass.
lib_deps = bitbank2/PNGenc@1.4.0

; Turns .env into a header before the build, so credentials never sit in the
; source tree, stamps the commit being built into another one, and turns the
; sprite in assets/ into a third. All three write into the build directory, so
; building a tree never dirties it.
extra_scripts =
  pre:secrets.py
  pre:version.py
  pre:nyan.py

monitor_speed = 115200
; On the S3's native USB-Serial-JTAG, DTR drives GPIO0 and RTS drives EN - and
; macOS asserts DTR the moment the port is opened. Left at the default, simply
; attaching a monitor resets the board into `waiting for download` and the
; sketch never runs while anything is watching it.
monitor_dtr = 0
monitor_rts = 0
; A panic prints a list of addresses and nothing else. The decoder turns them
; into the backtrace they stand for, off the ELF of the env being watched - so
; this wants the env named: npm run firmware:monitor -- -e <env>. The timestamps
; are what make a race in the log legible as one.
monitor_filters = esp32_exception_decoder, time

; One panel driver and one touch driver are compiled, never both of either:
; each pair defines the same functions and the linker is right to object.

[env:esp32-s3-touch-lcd-185]
; 16MB of flash. The wrong flash header stops the sketch before it ever reaches
; setup(), which reads as a bad flash rather than as a wrong number here.
board_build.flash_size = 16MB
; Not default_16MB.csv. That reserves a second 6.25MB app slot for an OTA this
; has never done - there is no ArduinoOTA, no Update, and flash.sh is esptool
; over USB - and spends what is left on a 3.4MB filesystem. This table keeps
; both slots at 4.5MB, which is still three times the image, and the flash that
; frees goes to the filesystem. nvs stays at 0x9000 for 0x5000, so the stored
; session tokens live through the reflash and the read-flash command in
; AGENTS.md is still pointed at the right place.
board_build.partitions = large_spiffs_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DBOARD_LCD_185B
build_src_filter = +<*> -<panel_co5300.cpp> -<esp_lcd_co5300.c> -<touchpad_cst9217.cpp>
  -<battery_axp2101.cpp>

[env:esp32-s3-touch-amoled-175c]
; 32MB, and this is the difference between this board and the plain 1.75, which
; has half of it. Both tables put nvs at 0x9000 for 0x5000, so reading the saved
; session token back off either board is the same command.
board_build.flash_size = 32MB
; The same trade as the other board: 22.9MB of filesystem where the default left
; 6.75MB. The partition inside is named spiffs in a file named for littlefs,
; which looks like a mistake and is not - Arduino's LittleFS mounts the label
; `spiffs`, so the label is the part that has to match and the filename is only
; a filename.
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
build_flags = ${env.build_flags} -DBOARD_AMOLED_175C
build_src_filter = +<*> -<panel_st77916.cpp> -<esp_lcd_st77916.c> -<touchpad_cst816s.cpp>
  -<battery_bq27220.cpp>
